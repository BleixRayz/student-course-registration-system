version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: course_registration_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: course_registration
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/config/database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - course_registration_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: course_registration_server
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/course_registration
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: course_registration
      JWT_SECRET: your_super_secret_jwt_key
      NODE_ENV: development
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - course_registration_network
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: course_registration_client
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - server
    networks:
      - course_registration_network
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  postgres_data:

networks:
  course_registration_network:
    driver: bridge
